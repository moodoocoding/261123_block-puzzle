<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 퍼즐 챔피언</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            margin: 0;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            background: radial-gradient(circle at top, #1e293b 0%, #0b1120 100%);
        }
        .digital-font {
            font-family: 'Orbitron', sans-serif;
        }
        .arcade-btn {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.45);
        }
        .arcade-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.45);
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
        }
        /* ----- 이름 입력 & 오늘의 랭킹 ----- */
        input { user-select: text; -webkit-user-select: text; touch-action: manipulation; }
        .scrolly { overflow-y: auto; touch-action: pan-y; }
        .pname { width: 100%; padding: 12px 14px; border-radius: 16px; border: 2px solid #38bdf8; background: #0b1120;
                 color: #fff; font: inherit; font-size: 20px; text-align: center; outline: none; }
        .pname:focus { border-color: #fde047; }
        .pname.need { border-color: #f87171; background: rgba(127, 29, 29, 0.5); animation: shake 0.4s; }
        .pname.need::placeholder { color: #fecaca; }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .rbox { background: rgba(0, 0, 0, 0.45); border: 1px solid #334155; border-radius: 18px; padding: 10px; margin-bottom: 14px; text-align: left; }
        .rbox h3 { display: flex; justify-content: space-between; align-items: center; font-size: 16px; color: #fde047; margin: 0 4px 6px; }
        .rbox h3 span { background: #fde047; color: #0f172a; border-radius: 999px; padding: 1px 10px; font-size: 14px; }
        .rlist { display: flex; flex-direction: column; gap: 5px; }
        .ritem { display: grid; grid-template-columns: 2em 1fr auto; align-items: center; gap: 8px; padding: 6px 10px;
                 border-radius: 12px; background: rgba(255, 255, 255, 0.06); font-size: 16px; text-align: left; }
        .ritem.first { background: rgba(250, 204, 21, 0.16); }
        .ritem.mine { outline: 2px solid #38bdf8; background: rgba(56, 189, 248, 0.16); }
        .ritem .rk { text-align: center; }
        .ritem .rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ritem .rn em { font-style: normal; font-size: 11px; background: #38bdf8; color: #0f172a; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
        .ritem .rn small { display: block; font-size: 11px; color: #94a3b8; }
        .ritem .rs { font-family: 'Orbitron', sans-serif; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .rdel { font-family: 'Jua', sans-serif; font-size: 12px; background: #7f1d1d; color: #fecaca; border: 1px solid #f87171; border-radius: 8px; padding: 2px 8px; cursor: pointer; }
        .rempty { color: #94a3b8; font-size: 14px; text-align: center; padding: 10px 0; }
        .rnote { color: #94a3b8; font-size: 11px; margin: 6px 4px 0; }
        .rmgr { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .rmgr button { font: inherit; font-size: 12px; color: #94a3b8; background: none; border: 1px dashed #475569; border-radius: 10px; padding: 4px 10px; cursor: pointer; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white relative">

    <!-- 상단 점수 & 최고 기록 HUD -->
    <header class="w-full max-w-md flex items-center justify-between gap-3 pt-1 z-10">
        <!-- 현재 점수 -->
        <div class="flex-1 bg-slate-900/85 border-2 border-sky-400/50 rounded-2xl px-4 py-1.5 shadow-lg flex items-center justify-center gap-2.5">
            <span class="text-lg sm:text-xl">⭐</span>
            <div>
                <div class="text-[10px] text-slate-400 leading-none">SCORE</div>
                <div id="score-display" class="digital-font text-xl sm:text-2xl font-black text-white">0</div>
            </div>
        </div>

        <!-- 최고 기록 -->
        <div class="flex-1 bg-slate-900/85 border-2 border-emerald-400/50 rounded-2xl px-4 py-1.5 shadow-lg flex items-center justify-center gap-2.5">
            <span class="text-lg sm:text-xl">👑</span>
            <div>
                <div class="text-[10px] text-slate-400 leading-none">오늘 1등</div>
                <div id="best-display" class="digital-font text-xl sm:text-2xl font-black text-emerald-400">0</div>
            </div>
        </div>

        <!-- 오늘의 랭킹 -->
        <button id="btn-rank" class="arcade-btn bg-amber-400 text-slate-950 border-2 border-amber-200 rounded-2xl px-3 py-2 text-base sm:text-lg cursor-pointer whitespace-nowrap">🏆 랭킹</button>
    </header>

    <!-- 중앙 8x8 보드 & 하단 3개 블록 트레이 캔버스 -->
    <main class="flex-1 w-full max-w-md flex items-center justify-center min-h-0 my-1 relative">
        <canvas id="puzzleCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
    </main>

    <!-- 하단 안내 & 새 게임 버튼 -->
    <footer class="w-full max-w-md flex items-center justify-between gap-2 pb-1 z-10 text-xs sm:text-sm text-slate-300">
        <span class="bg-white/10 px-3 py-1.5 rounded-xl border border-white/10">
            👆 아래 블록을 끌어 8×8 판에 채우세요!
        </span>
        <button id="btn-finish" class="arcade-btn bg-slate-800 hover:bg-slate-700 border border-slate-500 text-white px-3.5 py-1.5 rounded-xl cursor-pointer whitespace-nowrap">
            🏁 끝내고 기록하기
        </button>
    </footer>

    <!-- 게임 오버 오버레이 -->
    <div id="gameover-overlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-3 text-center z-30">
        <div class="scrolly bg-slate-900/95 border-4 border-amber-400 rounded-3xl p-5 sm:p-6 max-w-sm w-full max-h-full shadow-2xl">
            <div class="text-4xl sm:text-5xl mb-1">🧩✨</div>
            <h2 id="over-title" class="text-2xl sm:text-3xl text-amber-300 mb-1">더 이상 놓을 곳이 없어요!</h2>
            <p id="over-sub" class="text-xs sm:text-sm text-slate-400 mb-3">가로·세로 줄을 맞추면 블록이 터지며 점수를 얻습니다!</p>

            <div class="grid grid-cols-2 gap-2 bg-black/50 border border-slate-700 rounded-2xl p-3 mb-3">
                <div class="flex flex-col items-center border-r border-slate-700">
                    <span class="text-[11px] text-slate-400">최종 점수</span>
                    <span id="final-score" class="digital-font text-xl sm:text-2xl font-black text-white">0</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[11px] text-slate-400">오늘 1등 점수</span>
                    <span id="final-best" class="digital-font text-xl sm:text-2xl font-black text-emerald-400">0</span>
                </div>
            </div>

            <!-- 오늘의 랭킹 TOP 5 & 내 등수 -->
            <div id="over-rank"></div>

            <button id="btn-restart" class="arcade-btn w-full bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-bold text-xl sm:text-2xl py-3 rounded-2xl border-2 border-amber-200 cursor-pointer">
                🚀 다시 도전하기!
            </button>
            <button id="btn-next-player" class="arcade-btn w-full mt-3 bg-slate-800 hover:bg-slate-700 text-white text-base sm:text-lg py-2.5 rounded-2xl border border-slate-500 cursor-pointer">
                🙋 다음 친구 차례 (처음으로)
            </button>
        </div>
    </div>

    <!-- 시작 화면: 이름을 적어야 랭킹에 올라가요 -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-30">
        <div class="bg-slate-900/95 border-4 border-sky-400 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl">
            <div class="text-5xl sm:text-6xl mb-2">🧩</div>
            <h1 class="text-3xl sm:text-4xl text-sky-300 mb-1">블록 퍼즐 챔피언</h1>
            <p class="text-sm text-slate-300 mb-4">블록을 끌어 8×8 판에 놓고,<br>가로·세로 줄을 꽉 채워 터뜨리세요!</p>
            <input id="player-name" class="pname mb-3" maxlength="10" autocomplete="off" placeholder="이름(별명)을 적어 주세요">
            <button id="btn-start" class="arcade-btn w-full bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-bold text-xl sm:text-2xl py-3 rounded-2xl border-2 border-amber-200 cursor-pointer">
                🚀 시작하기
            </button>
            <button id="btn-rank-start" class="arcade-btn w-full mt-3 bg-slate-800 hover:bg-slate-700 text-white text-base sm:text-lg py-2.5 rounded-2xl border border-slate-500 cursor-pointer">
                🏆 오늘의 랭킹 보기
            </button>
        </div>
    </div>

    <!-- 오늘의 랭킹 창 -->
    <div id="rank-overlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-3 text-center z-40">
        <div class="scrolly bg-slate-900/95 border-4 border-amber-400 rounded-3xl p-5 max-w-sm w-full max-h-full shadow-2xl">
            <h2 class="text-2xl sm:text-3xl text-amber-300 mb-1">🏆 오늘의 랭킹</h2>
            <p class="text-xs text-slate-400 mb-3">오늘 부스에서 점수가 높은 순서예요.</p>
            <div id="rank-body"></div>
            <button id="btn-rank-close" class="arcade-btn w-full mt-3 bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 text-lg py-2.5 rounded-2xl border-2 border-amber-200 cursor-pointer">닫기</button>
            <div class="rmgr"><button id="rm-btn"></button><button id="rc-btn"></button></div>
        </div>
    </div>

    <script src="board.js"></script>

    <script>
        /**
         * 블록 퍼즐 챔피언 (8×8 블록 퍼즐)
         * - 입체 베벨 광택 블록(파랑, 주황, 초록, 노랑, 보라) 비주얼 구현
         * - 드래그 시 손가락/마우스 위쪽으로 살짝 띄워 보여주고, 보드 위 착지 예상 위치에 반투명 가이드 표시
         * - 가로/세로 줄 완성 시 화려한 파편 파티클과 함께 연쇄 콤보 점수 지급
         */

        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        // 공용 랭킹. board.js를 못 불러와도 게임은 그대로 할 수 있게 빈 랭킹으로 대신해요
        const Board = typeof createBoard === 'function' ? createBoard('block')
            : { online: false, user: null, today: () => [], submit: () => null, isMine: () => false, onChange() {}, init() {}, login() {}, remove() {}, clearToday() {} };

        // UI 요소 참조
        const scoreDisplay = document.getElementById('score-display');
        const bestDisplay = document.getElementById('best-display');
        const gameoverOverlay = document.getElementById('gameover-overlay');

        // 사운드 시스템 (Web Audio API)
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, delay = 0, duration = 0.14, type = 'triangle', vol = 0.2) {
            try {
                const ac = getAudioCtx();
                if (!ac) return;
                const t = ac.currentTime + delay;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.001, t);
                gain.gain.linearRampToValueAtTime(vol, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start(t);
                osc.stop(t + duration + 0.02);
            } catch (e) {}
        }

        function playSound(kind, combo = 1) {
            if (kind === 'pick') {
                playTone(520, 0, 0.07, 'sine', 0.14);
            } else if (kind === 'place') {
                playTone(330, 0, 0.09, 'triangle', 0.22);
                playTone(440, 0.03, 0.09, 'triangle', 0.16);
            } else if (kind === 'invalid') {
                playTone(190, 0, 0.12, 'sawtooth', 0.14);
            } else if (kind === 'clear') {
                const base = 523.25 * Math.pow(1.08, Math.min(combo - 1, 5));
                playTone(base, 0, 0.16, 'triangle', 0.24);
                playTone(base * 1.25, 0.07, 0.18, 'triangle', 0.24);
                playTone(base * 1.5, 0.14, 0.28, 'triangle', 0.26);
            } else if (kind === 'gameover') {
                playTone(392, 0, 0.2, 'sawtooth', 0.18);
                playTone(349.23, 0.18, 0.2, 'sawtooth', 0.18);
                playTone(293.66, 0.36, 0.4, 'sawtooth', 0.2);
            }
        }

        // ==========================================
        // 1. 첨부 이미지 기반 블록 색상 및 보석 테마 정의
        // ==========================================
        const BLOCK_THEMES = {
            blue: {
                main: '#0284c7',
                top: '#38bdf8',
                left: '#0ea5e9',
                right: '#0369a1',
                bottom: '#075985'
            },
            orange: {
                main: '#ea580c',
                top: '#fb923c',
                left: '#f97316',
                right: '#c2410c',
                bottom: '#9a3412'
            },
            green: {
                main: '#16a34a',
                top: '#4ade80',
                left: '#22c55e',
                right: '#15803d',
                bottom: '#166534'
            },
            yellow: {
                main: '#eab308',
                top: '#fde047',
                left: '#facc15',
                right: '#ca8a04',
                bottom: '#a16207'
            },
            purple: {
                main: '#9333ea',
                top: '#c084fc',
                left: '#a855f7',
                right: '#7e22ce',
                bottom: '#581c87'
            }
        };

        const COLOR_KEYS = ['blue', 'orange', 'green', 'yellow', 'purple'];

        // 다양한 테트로미노 / 펜토미노 블록 모양 정의
        const SHAPES = [
            [[1]],                                       // 1x1 점
            [[1, 1]],                                    // 1x2 가로
            [[1], [1]],                                  // 2x1 세로
            [[1, 1, 1]],                                 // 1x3 가로
            [[1], [1], [1]],                             // 3x1 세로
            [[1, 1, 1, 1]],                              // 1x4 가로
            [[1], [1], [1], [1]],                        // 4x1 세로
            [[1, 1], [1, 1]],                            // 2x2 정사각형
            [[1, 1, 1], [1, 1, 1], [1, 1, 1]],           // 3x3 대형 정사각형
            [[1, 1], [0, 1]],                            // 작은 ㄱ자 (첨부 이미지 노란 블록!)
            [[1, 1], [1, 0]],                            // 작은 ㄱ자 대칭
            [[1, 0], [1, 1]],                            // 작은 ㄴ자
            [[0, 1], [1, 1]],                            // 작은 ㄴ자 대칭
            [[1, 0, 0], [1, 1, 1]],                      // 큰 ㄴ자
            [[0, 0, 1], [1, 1, 1]],                      // 큰 ㄴ자 대칭
            [[1, 1, 1], [1, 0, 0]],                      // 큰 ㄱ자
            [[1, 1, 1], [0, 0, 1]],                      // 큰 ㄱ자 대칭
            [[0, 1, 0], [1, 1, 1]],                      // ㅗ자
            [[1, 1, 1], [0, 1, 0]],                      // ㅜ자
            [[1, 1, 0], [0, 1, 1]],                      // Z자
            [[0, 1, 1], [1, 1, 0]]                       // S자
        ];

        // ==========================================
        // 2. 게임 상태 & 보드 데이터
        // ==========================================
        const GRID_SIZE = 8;
        let board = []; // 8x8 배열 (null 또는 themeKey 문자열)
        let trayPieces = [null, null, null]; // 하단 3개 블록 슬롯
        let score = 0;
        let bestScore = 0; // 오늘의 랭킹 1등 점수 (랭킹이 바뀌면 함께 바뀌어요)

        // 랭킹에 올릴 정보
        let player = '';      // 지금 하는 친구 이름
        let playing = false;  // 게임을 하는 중인지
        let tStart = 0;       // 시작한 시각
        let myId = null;      // 방금 올린 내 기록

        // 드래그 상태
        let draggingIndex = -1;
        let dragPointerX = 0;
        let dragPointerY = 0;
        let hoverGridRow = -1;
        let hoverGridCol = -1;
        let isHoverValid = false;

        // 이펙트 (파티클 & 떠오르는 콤보 텍스트)
        let particles = [];
        let floatingTexts = [];
        let clearFlashCells = []; // 줄이 터질 때 반짝이는 잔상

        // 레이아웃 계산용 좌표 변수
        let canvasW = 400;
        let canvasH = 600;
        let boardX = 20;
        let boardY = 20;
        let cellSize = 42;
        let trayY = 400;
        let traySlotCenters = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasW = rect.width;
            canvasH = rect.height;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // 화면 높이와 너비에 맞춰 8x8 보드와 하단 트레이 비율 자동 계산
            const maxBoardW = canvasW - 24;
            const maxBoardH = canvasH * 0.64;
            const boardSide = Math.min(maxBoardW, maxBoardH);

            cellSize = Math.floor(boardSide / GRID_SIZE);
            const actualBoardSide = cellSize * GRID_SIZE;
            boardX = Math.floor((canvasW - actualBoardSide) / 2);
            boardY = Math.max(10, Math.floor((canvasH * 0.66 - actualBoardSide) / 2));

            trayY = boardY + actualBoardSide + (canvasH - (boardY + actualBoardSide)) * 0.52;
            const slotW = canvasW / 3;
            traySlotCenters = [
                { x: slotW * 0.5, y: trayY },
                { x: slotW * 1.5, y: trayY },
                { x: slotW * 2.5, y: trayY }
            ];
        }
        window.addEventListener('resize', resizeCanvas);

        // ==========================================
        // 3. 보드 및 랜덤 조각 생성 로직
        // ==========================================
        function createPiece() {
            const matrix = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const baseColor = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];

            const cellThemes = matrix.map(row =>
                row.map(val => (val ? baseColor : null))
            );

            return {
                matrix,
                cellThemes,
                rows: matrix.length,
                cols: matrix[0].length,
                scaleAnim: 0.1
            };
        }

        function refillTrayIfEmpty() {
            if (trayPieces.every(p => p === null)) {
                trayPieces = [createPiece(), createPiece(), createPiece()];
            }
        }

        function initGame() {
            getAudioCtx();
            board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
            score = 0;
            draggingIndex = -1;
            particles = [];
            floatingTexts = [];
            clearFlashCells = [];

            // 시작 시 보드 하단에 몇 개의 기본 블록을 예쁘게 미리 배치
            const presetBlocks = [
                { r: 6, c: 0, t: 'blue' }, { r: 7, c: 0, t: 'orange' },
                { r: 7, c: 1, t: 'orange' }, { r: 6, c: 2, t: 'yellow' },
                { r: 7, c: 4, t: 'purple' }, { r: 6, c: 6, t: 'green' },
                { r: 7, c: 6, t: 'green' }, { r: 7, c: 7, t: 'green' }
            ];
            presetBlocks.forEach(b => {
                board[b.r][b.c] = b.t;
            });

            trayPieces = [createPiece(), createPiece(), createPiece()];
            myId = null;
            tStart = Date.now();
            updateScoreUI();
            gameoverOverlay.classList.add('hidden');
            resizeCanvas();
        }

        function updateScoreUI() {
            scoreDisplay.textContent = score.toLocaleString();
            // 오늘 랭킹 1등 점수와 내 점수 중 더 큰 값을 보여 줘요
            bestScore = Math.max(score, ...Board.today().map(r => r.score || 0));
            bestDisplay.textContent = bestScore.toLocaleString();
        }

        // 특정 조각을 (startRow, startCol)에 놓을 수 있는지 확인
        function canPlacePiece(piece, startRow, startCol) {
            if (!piece) return false;
            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    if (piece.matrix[r][c]) {
                        const br = startRow + r;
                        const bc = startCol + c;
                        if (br < 0 || br >= GRID_SIZE || bc < 0 || bc >= GRID_SIZE) {
                            return false;
                        }
                        if (board[br][bc] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        // 남은 트레이 조각 중 하나라도 보드 어딘가에 놓을 수 있는지 검사 (게임 오버 판별)
        function checkGameOver() {
            const remaining = trayPieces.filter(p => p !== null);
            if (remaining.length === 0) return false;

            for (const piece of remaining) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canPlacePiece(piece, r, c)) {
                            return false; // 하나라도 놓을 수 있으면 계속 진행
                        }
                    }
                }
            }
            return true;
        }

        // 조각 배치 및 가로·세로 줄 클리어 검사
        function placePieceOnBoard(pieceIndex, startRow, startCol) {
            const piece = trayPieces[pieceIndex];
            let placedCount = 0;

            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    if (piece.matrix[r][c]) {
                        board[startRow + r][startCol + c] = piece.cellThemes[r][c];
                        placedCount++;
                    }
                }
            }

            trayPieces[pieceIndex] = null;
            score += placedCount * 10;
            playSound('place');

            // 꽉 찬 가로줄 및 세로줄 찾기
            const fullRows = [];
            const fullCols = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                if (board[r].every(cell => cell !== null)) fullRows.push(r);
            }
            for (let c = 0; c < GRID_SIZE; c++) {
                let colFull = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (board[r][c] === null) {
                        colFull = false;
                        break;
                    }
                }
                if (colFull) fullCols.push(c);
            }

            const linesCleared = fullRows.length + fullCols.length;
            if (linesCleared > 0) {
                const cellsToClear = new Set();
                fullRows.forEach(r => {
                    for (let c = 0; c < GRID_SIZE; c++) cellsToClear.add(`${r},${c}`);
                });
                fullCols.forEach(c => {
                    for (let r = 0; r < GRID_SIZE; r++) cellsToClear.add(`${r},${c}`);
                });

                cellsToClear.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    const themeKey = board[r][c];

                    // 블록 폭발 파티클 & 플래시 생성
                    const cx = boardX + (c + 0.5) * cellSize;
                    const cy = boardY + (r + 0.5) * cellSize;
                    const theme = BLOCK_THEMES[themeKey] || BLOCK_THEMES.yellow;
                    spawnBlockExplosion(cx, cy, theme.top);
                    clearFlashCells.push({ r, c, life: 1.0 });

                    board[r][c] = null;
                });

                const comboBonus = linesCleared * linesCleared * 100;
                score += comboBonus;
                playSound('clear', linesCleared);

                // 콤보 텍스트 띄우기
                const msg = linesCleared >= 2
                    ? `${linesCleared}줄 콤보! +${comboBonus}`
                    : `클리어! +${comboBonus}`;
                floatingTexts.push({
                    x: boardX + (GRID_SIZE * cellSize) / 2,
                    y: boardY + (GRID_SIZE * cellSize) / 2,
                    text: msg,
                    life: 1.0
                });
            }

            refillTrayIfEmpty();
            updateScoreUI();

            if (checkGameOver()) {
                playing = false; // 결과 창이 뜨기 전에 다시 끝내지 못하게 해요
                setTimeout(() => finishGame(false), 450);
            }
        }

        // ==========================================
        // 3-1. 오늘의 랭킹 (board.js가 Firebase에 저장해서 부스의 모든 기기가 같은 랭킹을 봐요)
        // ==========================================
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const rankSort = (a, b) => b.score - a.score || a.t - b.t || a.at - b.at; // 점수가 높은 순, 같으면 빨리 끝낸 순
        function fmt(ms) { const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`; }
        let rankManage = false, rankView = [];

        // 게임 끝: 점수를 랭킹에 올리고 결과 창을 보여 줘요
        function finishGame(byButton) {
            playing = false;
            draggingIndex = -1;
            playSound('gameover');
            const t = Math.max(1, Date.now() - tStart);
            myId = score > 0 ? Board.submit({ name: (player || '도전자').slice(0, 12), score, t }) : null;
            updateScoreUI();
            $('over-title').textContent = byButton ? '수고했어요!' : '더 이상 놓을 곳이 없어요!';
            $('over-sub').textContent = score > 0 ? `${player} 님의 점수를 오늘의 랭킹에 올렸어요.` : '블록을 하나도 놓지 않아서 기록하지 않았어요.';
            $('final-score').textContent = score.toLocaleString();
            $('final-best').textContent = bestScore.toLocaleString();
            renderOverRank();
            gameoverOverlay.classList.remove('hidden');
        }

        function rankItems(list, del) {
            if (!list.length) return '<p class="rempty">아직 오늘 기록이 없어요. 첫 번째 챔피언이 되어 보세요!</p>';
            return list.map((r, i) => {
                const mine = myId && Board.isMine(r, [myId]);
                return `<div class="ritem ${i === 0 ? 'first' : ''} ${mine ? 'mine' : ''}"><span class="rk">${i < 3 ? ['🥇', '🥈', '🥉'][i] : (i + 1)}</span>
                    <span class="rn">${esc(r.name)}${mine ? ' <em>나</em>' : ''}<small>${fmt(r.t)} 동안 했어요</small></span>
                    <span class="rs">${Number(r.score).toLocaleString()}${del ? `<button class="rdel" onclick="delRank(${i})">삭제</button>` : ''}</span></div>`;
            }).join('');
        }
        function rankNote() {
            return Board.online ? '🟢 오늘 부스에서 도전한 모든 친구의 순위예요. 실시간으로 바뀌어요.'
                : '🟡 지금은 이 기기에서 한 기록만 보여요. 연결되면 자동으로 올라가요.';
        }
        function renderOverRank() {
            const el = $('over-rank');
            if (!el) return;
            const sorted = Board.today().sort(rankSort);
            const r = myId ? sorted.findIndex(x => Board.isMine(x, [myId])) + 1 : 0;
            el.innerHTML = `<div class="rbox"><h3>🏆 오늘의 랭킹 ${r ? `<span>나는 ${r}등!</span>` : ''}</h3>
                <div class="rlist">${rankItems(sorted.slice(0, 5), false)}</div><p class="rnote">${rankNote()}</p></div>`;
        }
        function openRank() {
            rankManage = false;
            $('rank-overlay').classList.remove('hidden');
            renderRankModal();
        }
        function renderRankModal() {
            if ($('rank-overlay').classList.contains('hidden')) return;
            rankView = Board.today().sort(rankSort).slice(0, rankManage ? 50 : 10);
            $('rank-body').innerHTML = `<div class="rlist">${rankItems(rankView, rankManage)}</div><p class="rnote">${rankNote()}</p>`;
            $('rm-btn').textContent = rankManage ? '✅ 관리 끝내기' : (Board.online && !Board.user ? '🔧 선생님 관리 (구글 로그인)' : '🔧 선생님 관리');
            $('rc-btn').textContent = '🗑 오늘 기록 전체 지우기';
            $('rc-btn').classList.toggle('hidden', !rankManage);
        }
        async function toggleRankManage() {
            if (!rankManage && Board.online && !Board.user) {
                try { await Board.login(); } catch (e) { alert('선생님 로그인을 하지 못했어요. 다시 시도해 주세요.'); return; }
            }
            rankManage = !rankManage;
            renderRankModal();
        }
        async function delRank(i) {
            const r = rankView[i];
            if (!r || !confirm(`"${r.name}" 기록을 지울까요?`)) return;
            try { await Board.remove(r); } catch (e) { alert('지우지 못했어요. Firebase 규칙에 적은 선생님 계정으로 로그인했는지 확인해 주세요.'); }
        }
        async function clearRank() {
            if (!confirm('오늘 기록을 모두 지울까요? 지운 기록은 되살릴 수 없어요.')) return;
            try { await Board.clearToday(); } catch (e) { alert('지우지 못했어요. Firebase 규칙에 적은 선생님 계정으로 로그인했는지 확인해 주세요.'); }
        }

        // 시작 화면에서 이름을 적어야 시작할 수 있어요
        function beginGame() {
            const input = $('player-name');
            const name = input.value.trim();
            if (!name) {
                input.classList.remove('need'); void input.offsetWidth; input.classList.add('need');
                input.placeholder = '✏️ 이름(별명)을 먼저 적어 주세요!';
                input.focus();
                return;
            }
            player = name.slice(0, 12);
            input.blur();
            $('start-overlay').classList.add('hidden');
            initGame();
            playing = true;
        }
        // 다음 친구 차례: 이름을 지우고 시작 화면으로 돌아가요
        function goStart() {
            playing = false;
            player = '';
            initGame();
            const input = $('player-name');
            input.value = ''; input.classList.remove('need'); input.placeholder = '이름(별명)을 적어 주세요';
            $('start-overlay').classList.remove('hidden');
        }

        function spawnBlockExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 2 + Math.random() * 5;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd - 1.5,
                    size: 4 + Math.random() * 4,
                    life: 1.0,
                    color
                });
            }
        }

        // ==========================================
        // 4. 터치 / 마우스 드래그 앤 드롭 입력 처리
        // ==========================================
        function getCanvasPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // 손가락으로 가려지지 않도록 드래그 중인 블록을 포인터 위쪽으로 띄워주는 오프셋
        const DRAG_LIFT_Y = 75;

        function updateDragHover() {
            if (draggingIndex === -1) return;
            const piece = trayPieces[draggingIndex];
            if (!piece) return;

            const liftedCenterX = dragPointerX;
            const liftedCenterY = dragPointerY - DRAG_LIFT_Y;

            const piecePixelW = piece.cols * cellSize;
            const piecePixelH = piece.rows * cellSize;

            const topLeftX = liftedCenterX - piecePixelW / 2;
            const topLeftY = liftedCenterY - piecePixelH / 2;

            const col = Math.round((topLeftX - boardX) / cellSize);
            const row = Math.round((topLeftY - boardY) / cellSize);

            hoverGridRow = row;
            hoverGridCol = col;
            isHoverValid = canPlacePiece(piece, row, col);
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!playing) return;
            getAudioCtx();
            const pos = getCanvasPos(e.clientX, e.clientY);

            // 하단 트레이 3개 슬롯 중 클릭된 조각 찾기
            for (let i = 0; i < 3; i++) {
                if (!trayPieces[i]) continue;
                const center = traySlotCenters[i];
                if (Math.abs(pos.x - center.x) < canvasW / 6 && Math.abs(pos.y - center.y) < 75) {
                    draggingIndex = i;
                    dragPointerX = pos.x;
                    dragPointerY = pos.y;
                    updateDragHover();
                    playSound('pick');
                    break;
                }
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (draggingIndex === -1) return;
            const pos = getCanvasPos(e.clientX, e.clientY);
            dragPointerX = pos.x;
            dragPointerY = pos.y;
            updateDragHover();
        });

        window.addEventListener('pointerup', () => {
            if (draggingIndex === -1) return;
            if (!playing) { draggingIndex = -1; isHoverValid = false; return; }
            if (isHoverValid) {
                placePieceOnBoard(draggingIndex, hoverGridRow, hoverGridCol);
            } else {
                playSound('invalid');
            }
            draggingIndex = -1;
            isHoverValid = false;
        });

        window.addEventListener('pointercancel', () => {
            draggingIndex = -1;
            isHoverValid = false;
        });

        // ==========================================
        // 5. 렌더링 (첨부 이미지의 입체 베벨 블록 + 보석 렌더링)
        // ==========================================
        function drawBevelTile(x, y, size, themeKey, alpha = 1.0) {
            const theme = BLOCK_THEMES[themeKey] || BLOCK_THEMES.blue;
            const pad = 1.5;
            const bx = x + pad;
            const by = y + pad;
            const bs = size - pad * 2;
            const bevel = Math.max(4, bs * 0.16);

            ctx.save();
            ctx.globalAlpha = alpha;

            // 1. 기본 바탕
            ctx.fillStyle = theme.main;
            ctx.fillRect(bx, by, bs, bs);

            // 2. 상단 밝은 사다리꼴 베벨
            ctx.fillStyle = theme.top;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + bs, by);
            ctx.lineTo(bx + bs - bevel, by + bevel);
            ctx.lineTo(bx + bevel, by + bevel);
            ctx.closePath();
            ctx.fill();

            // 3. 좌측 밝은 베벨
            ctx.fillStyle = theme.left;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + bevel, by + bevel);
            ctx.lineTo(bx + bevel, by + bs - bevel);
            ctx.lineTo(bx, by + bs);
            ctx.closePath();
            ctx.fill();

            // 4. 우측 어두운 베벨
            ctx.fillStyle = theme.right;
            ctx.beginPath();
            ctx.moveTo(bx + bs, by);
            ctx.lineTo(bx + bs, by + bs);
            ctx.lineTo(bx + bs - bevel, by + bs - bevel);
            ctx.lineTo(bx + bs - bevel, by + bevel);
            ctx.closePath();
            ctx.fill();

            // 5. 하단 가장 어두운 베벨
            ctx.fillStyle = theme.bottom;
            ctx.beginPath();
            ctx.moveTo(bx, by + bs);
            ctx.lineTo(bx + bs, by + bs);
            ctx.lineTo(bx + bs - bevel, by + bs - bevel);
            ctx.lineTo(bx + bevel, by + bs - bevel);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawBoard() {
            const totalSide = cellSize * GRID_SIZE;

            // 보드 외곽 프레임
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(boardX - 8, boardY - 8, totalSide + 16, totalSide + 16, 16);
            ctx.fill();
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 8x8 격자 빈 칸 & 배치된 블록 그리기
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cx = boardX + c * cellSize;
                    const cy = boardY + r * cellSize;

                    // 빈 칸 격자 배경 (첨부 이미지의 어두운 네이비 정사각형 라인)
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#162038' : '#131c31';
                    ctx.fillRect(cx + 1.5, cy + 1.5, cellSize - 3, cellSize - 3);
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(cx + 1.5, cy + 1.5, cellSize - 3, cellSize - 3);

                    // 채워진 블록
                    if (board[r][c] !== null) {
                        drawBevelTile(cx, cy, cellSize, board[r][c], 1.0);
                    }
                }
            }

            // 드래그 중일 때 착지 예상 가이드(Ghost Preview) 표시
            if (draggingIndex !== -1 && isHoverValid) {
                const piece = trayPieces[draggingIndex];
                for (let r = 0; r < piece.rows; r++) {
                    for (let c = 0; c < piece.cols; c++) {
                        if (piece.matrix[r][c]) {
                            const gx = boardX + (hoverGridCol + c) * cellSize;
                            const gy = boardY + (hoverGridRow + r) * cellSize;
                            drawBevelTile(gx, gy, cellSize, piece.cellThemes[r][c], 0.38);
                        }
                    }
                }
            }

            // 줄 클리어 반짝임 잔상
            for (let i = clearFlashCells.length - 1; i >= 0; i--) {
                const fc = clearFlashCells[i];
                ctx.save();
                ctx.globalAlpha = fc.life * 0.85;
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(boardX + fc.c * cellSize, boardY + fc.r * cellSize, cellSize, cellSize);
                ctx.restore();
                fc.life -= 0.06;
                if (fc.life <= 0) clearFlashCells.splice(i, 1);
            }
        }

        function drawTrayAndDraggedPiece() {
            // 1. 하단 트레이 3개 조각 그리기 (드래그 중인 조각은 제외)
            const miniSize = Math.floor(cellSize * 0.56);

            for (let i = 0; i < 3; i++) {
                const piece = trayPieces[i];
                if (!piece || i === draggingIndex) continue;

                piece.scaleAnim += (1 - piece.scaleAnim) * 0.18;
                const s = miniSize * piece.scaleAnim;
                const center = traySlotCenters[i];
                const startX = center.x - (piece.cols * s) / 2;
                const startY = center.y - (piece.rows * s) / 2;

                for (let r = 0; r < piece.rows; r++) {
                    for (let c = 0; c < piece.cols; c++) {
                        if (piece.matrix[r][c]) {
                            drawBevelTile(startX + c * s, startY + r * s, s, piece.cellThemes[r][c], 1.0);
                        }
                    }
                }
            }

            // 2. 현재 손으로 드래그 중인 조각 그리기 (원래 보드 크기로 확대 + 은은한 노란 후광)
            if (draggingIndex !== -1 && trayPieces[draggingIndex]) {
                const piece = trayPieces[draggingIndex];
                const pw = piece.cols * cellSize;
                const ph = piece.rows * cellSize;
                const sx = dragPointerX - pw / 2;
                const sy = dragPointerY - DRAG_LIFT_Y - ph / 2;

                ctx.save();
                ctx.shadowColor = 'rgba(250, 204, 21, 0.55)';
                ctx.shadowBlur = 18;
                for (let r = 0; r < piece.rows; r++) {
                    for (let c = 0; c < piece.cols; c++) {
                        if (piece.matrix[r][c]) {
                            drawBevelTile(sx + c * cellSize, sy + r * cellSize, cellSize, piece.cellThemes[r][c], 0.96);
                        }
                    }
                }
                ctx.restore();
            }
        }

        function drawEffects() {
            // 파티클 업데이트 및 그리기
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.22;
                p.life -= 0.032;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 콤보 점수 텍스트 애니메이션
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1.2;
                ft.life -= 0.02;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = Math.min(1, ft.life * 1.4);
                ctx.font = 'bold 26px Jua, sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 5;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = '#fde047';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            ctx.clearRect(0, 0, canvasW, canvasH);
            drawBoard();
            drawTrayAndDraggedPiece();
            drawEffects();
        }

        // 버튼 이벤트 연결
        $('btn-finish').addEventListener('click', () => {
            if (!playing) return;
            if (confirm('여기서 끝내고 지금 점수를 랭킹에 올릴까요?')) finishGame(true);
        });
        $('btn-restart').addEventListener('click', () => { initGame(); playing = true; }); // 같은 이름으로 다시 도전
        $('btn-next-player').addEventListener('click', goStart);
        $('btn-start').addEventListener('click', beginGame);
        $('player-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') beginGame(); });
        $('btn-rank').addEventListener('click', openRank);
        $('btn-rank-start').addEventListener('click', openRank);
        $('btn-rank-close').addEventListener('click', () => $('rank-overlay').classList.add('hidden'));
        $('rm-btn').addEventListener('click', toggleRankManage);
        $('rc-btn').addEventListener('click', clearRank);

        // 랭킹이 바뀌면 화면에 보이는 순위와 "오늘 1등" 점수를 다시 그려요
        Board.onChange(() => { updateScoreUI(); if (!gameoverOverlay.classList.contains('hidden')) renderOverRank(); renderRankModal(); });

        // Firebase에서 이 게임 랭킹을 읽을 수 있을 때만 서버와 연결해요.
        // (읽지 못하면 이 기기에만 저장해 두었다가, 나중에 연결되면 자동으로 올려요)
        async function initBoard() {
            if (typeof loadFirebase !== 'function') return;
            try {
                const f = await loadFirebase();
                await f.fs.getDocs(f.fs.query(f.fs.collection(f.db, 'block'), f.fs.where('day', '==', boothDay()), f.fs.limit(1)));
            } catch (e) {
                console.warn('공용 랭킹에 연결하지 못해서 이 기기에만 저장해요', e);
                return;
            }
            Board.init();
        }

        window.onload = () => {
            initGame();
            requestAnimationFrame(renderLoop);
            initBoard();
        };
    </script>
</body>
</html>
